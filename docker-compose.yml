# PostgreSQL apenas para desenvolvimento local.
# As credenciais abaixo são locais e não devem ser usadas em produção.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ecocheck-postgres
    environment:
      POSTGRES_DB: ecocheck
      POSTGRES_USER: ecocheck
      POSTGRES_PASSWORD: ecocheck_dev
    ports:
      - "5432:5432"
    volumes:
      - ecocheck-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecocheck -d ecocheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ecocheck-pgdata:
